<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Cumpleaños ANDREA Hermosa</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b090a;--tx:#fce7f3;--cy:#67e8f9;--pk:#ff69b4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Poppins',sans-serif;background:var(--bg) radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.2px) 0 0/22px 22px;color:#fff;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;width:44px;height:44px;border-radius:50%;border:2px dashed var(--cy);background:#000a;color:#fff;font-size:20px;cursor:pointer}
#ban{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;font:700 2rem Caveat,cursive;padding:0 18px;border:2px dashed var(--cy);border-radius:18px 24px 16px 22px;background:#000b;text-shadow:0 0 8px #ff69b4,0 0 20px #ff1493}
.hid{display:none!important}
.card{width:100%;max-width:520px;margin:auto;text-align:center;padding:24px 20px;display:flex;flex-direction:column;align-items:center;background:#ffffff0a;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2.5px solid var(--cy);border-radius:28px 20px 30px 22px/22px 30px 20px 28px;box-shadow:5px 6px 0 #ff69b499,0 18px 36px #000a;position:relative;z-index:20}
h1,h2{font-family:Caveat,cursive;font-size:2rem;line-height:1.05;margin:0 0 12px;background:linear-gradient(90deg,#f9a8d4,#fda4af,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
h1::after{content:"";display:block;width:55%;height:8px;margin:6px auto 0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='8'><path d='M0 4 Q10 -1 20 4 T40 4' fill='none' stroke='%23f9a8d4' stroke-width='2.5' stroke-linecap='round'/></svg>") repeat-x center}
small{font-size:.7rem;letter-spacing:.2em;color:var(--cy);text-transform:uppercase;font-weight:600;margin-bottom:6px}
.box{width:100%;background:#0006;border:1.5px dashed #67e8f966;border-radius:16px 22px 14px 24px/22px 14px 24px 16px;padding:14px;margin:0 0 16px;font-family:Caveat,cursive;font-size:1.35rem;line-height:1.3;color:var(--tx)}
.box p{margin:0}
.av{width:88px;height:88px;border-radius:50%;border:2px dashed var(--cy);padding:4px;background:#0006;margin-bottom:8px;transform:rotate(-4deg);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.btn{width:100%;padding:10px 18px;border:2.5px solid #fff;border-radius:18px 24px 16px 26px/24px 16px 26px 18px;background:linear-gradient(90deg,#ec4899,#f43f5e,#db2777);color:#fff;font:700 1.45rem Caveat,cursive;cursor:pointer;box-shadow:3px 4px 0 #9d174d;margin-top:6px}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #9d174d}
.btn.alt{background:linear-gradient(90deg,#06b6d4,#14b8a6,#10b981);box-shadow:3px 4px 0 #0f766e}
.bar{width:70%;height:12px;border:1.5px dashed #67e8f980;border-radius:10px;padding:2px;overflow:hidden;margin:4px auto}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#f472b6,#fb7185,#db2777);animation:st 3s forwards}
.bar.l5 i{animation-duration:5s}
@keyframes st{0%{width:5%}20%{width:22%}30%{width:16%}50%{width:55%}65%{width:45%}85%{width:82%}92%{width:75%}100%{width:100%}}
.zi{animation:zi .35s cubic-bezier(.16,1,.3,1) forwards}
.zo{animation:zo .3s forwards}
@keyframes zi{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes zo{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.85)}}
#sq{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:Caveat,cursive;font-weight:700;text-align:center;line-height:1;background:linear-gradient(90deg,#f9a8d4,#fb7185,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 12px 30px #ff69b4cc)}
#sq span{animation:zz 1s forwards}
@keyframes zz{0%{transform:scale(.4);opacity:0;filter:blur(12px)}25%{transform:scale(1.15);opacity:1;filter:none}75%{transform:scale(1);opacity:1}100%{transform:scale(1.4);opacity:0;filter:blur(12px)}}
.emo{font-size:1.8rem;margin:0 0 12px;display:flex;gap:6px;justify-content:center}
.pop{animation:pp .7s cubic-bezier(.175,.885,.32,1.275) both}
@keyframes pp{0%{opacity:0;transform:translateY(30px) scale(.95)}60%{opacity:1;transform:translateY(-8px) scale(1.02)}100%{opacity:1;transform:none}}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin:8px 0}
.gb{background:#0006;border:2px dashed #67e8f9b3;border-radius:20px 14px 22px 16px/16px 22px 14px 20px;padding:10px;cursor:pointer}
.gb:nth-child(odd){rotate:-2deg}.gb:nth-child(even){rotate:2deg}
.gb img{width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 0 8px #ff69b4b3)}
.sh{animation:sh 5s forwards}
@keyframes sh{0%{transform:none}20%{transform:translateX(var(--c)) scale(1.15)}45%{transform:translate(var(--a),-25px) rotate(-20deg)}70%{transform:translate(var(--b),25px) rotate(20deg)}100%{transform:none}}
.rw{width:150px;height:150px;border-radius:18px;border:2px dashed var(--cy);padding:4px;background:#0008;margin-bottom:12px}
.rw img{width:100%;height:100%;object-fit:cover;border-radius:14px}
</style>
</head>
<body>
<button id="snd" onclick="mute()" aria-label="Música">🔊</button>
<canvas id="cv"></canvas>
<div id="ban" class="hid">ANDREA</div>

<main class="card" id="home">
  <h1>FELIZ CUMPLEAÑOS ANDREA HERMOSA</h1>
  <div class="box" style="font-size:1.1rem;margin-bottom:12px">✨ Pon la música para que todo sea mejor y perdón si tiene anuncios</div>
  <div style="width:100%;aspect-ratio:16/9;border:2px dashed var(--cy);border-radius:16px 22px 14px 24px;overflow:hidden;background:#000;margin-bottom:14px">
    <iframe id="yt" style="width:100%;height:100%;border:0" src="https://www.youtube.com/embed/hghqd1eBTYQ?autoplay=1&enablejsapi=1" title="Música de Cumpleaños" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
  <div id="ld0" style="width:100%"><div class="bar l5"><i></i></div><div id="ldt" style="font-size:.7rem;letter-spacing:.2em;color:#f9a8d4;text-transform:uppercase">Cargando sorpresa... 5s</div></div>
  <button class="btn hid" id="go0" onclick="start()">COMENZAR 💗</button>
</main>

<div id="sq" class="hid"></div>
<div id="ps" class="hid" style="width:100%;display:flex"></div>

<script>
const $=id=>document.getElementById(id);
/* ===== Partículas y confeti ===== */
const cv=$('cv'),c=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();onresize=rs;
const E=['💗','🌸','✨','🌷','💖'],col=['#ff69b4','#ff1493','#ffb6c1','#fde047','#da70d6','#fff'];
const P=[...Array(40)].map(()=>({x:Math.random()*W,y:Math.random()*H,s:10+Math.random()*12,v:.4+Math.random()*.9,e:E[Math.random()*5|0],a:.3+Math.random()*.5,t:Math.random()*6}));
const K=[];
function burst(){for(let i=0;i<20;i++)K.push({x:W/2+(Math.random()-.5)*60,y:H/2,vx:(Math.random()-.5)*9,vy:-3-Math.random()*7,g:.35,s:5+Math.random()*6,r:Math.random()*6,l:1,d:.03,c:col[Math.random()*6|0]})}
function rain(){let n=0;const t=setInterval(()=>{for(let i=0;i<5;i++)K.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*2,vy:3+Math.random()*4,g:0,s:5+Math.random()*7,r:Math.random()*6,l:1,d:.007,c:col[Math.random()*6|0]});if(++n>40)clearInterval(t)},50)}
(function loop(){c.clearRect(0,0,W,H);
P.forEach(p=>{p.y+=p.v;p.t+=.02;p.x+=Math.sin(p.t)*.5;if(p.y>H+20){p.y=-20;p.x=Math.random()*W}c.globalAlpha=p.a;c.font=p.s+'px serif';c.fillText(p.e,p.x,p.y)});
for(let i=K.length-1;i>=0;i--){const k=K[i];k.vy+=k.g;k.x+=k.vx;k.y+=k.vy;k.r+=.1;k.l-=k.d;if(k.l<=0||k.y>H+20){K.splice(i,1);continue}
c.save();c.translate(k.x,k.y);c.rotate(k.r);c.globalAlpha=k.l;c.fillStyle=k.c;c.fillRect(-k.s/2,-k.s/3,k.s,k.s*.6);c.restore()}
requestAnimationFrame(loop)})();

/* ===== Música ===== */
let muted=false;
const yt=cmd=>$('yt').contentWindow.postMessage(JSON.stringify({event:'command',func:cmd,args:''}),'*');
function mute(){muted=!muted;$('snd').textContent=muted?'🔇':'🔊';yt(muted?'mute':'unMute')}
function unmute(){if(muted){muted=false;$('snd').textContent='🔊'}yt('unMute');yt('playVideo')}

/* ===== Carga inicial ===== */
let s=5;const iv=setInterval(()=>{s--;if(s>=0)$('ldt').textContent='Cargando sorpresa... '+s+'s'},1000);
setTimeout(()=>{clearInterval(iv);$('ld0').classList.add('hid');$('go0').classList.remove('hid')},5300);

/* ===== Paneles ===== */
const G='https://encrypted-tbn0.gstatic.com/images?q=tbn:';
const T=[
 [G+'ANd9GcQi3CdegKPdm1dT09VPEZaehU0nad67IAE6XtTKg3yLNw&s=10','Lo mucho que te quiero ANDREA hermosa','“Eres esa persona maravillosa que ilumina cada uno de mis días con tu sonrisa, tu dulce alegría y la ternura inmensa que hay en tu corazón.”'],
 [G+'ANd9GcSq10V7NRunUQ478UvWCWJ-48A-z_euI2Ygaw&s','UN POEMA PARA TI','Bajo el cielo estrellado y su fulgor,<br>brillas tú con encanto y gran afecto.<br>ANDREA hermosa, mi alegría y mi ilusión,<br>hoy te felicito con todo respeto.'],
 [G+'ANd9GcQEpzrhjbW0VG_I1kpFfJpfONZL6GOw3yNpOGJGuG2jrQ&s','Una gran amistad','Quiero que sepas que cada instante compartiendo risas es un momento invaluable. Tu forma de ser le da color a mi mundo y valoro mucho cada ocurrencia y cada locura compartida contigo, ANDREA hermosa.'],
 [G+'ANd9GcTVBvvl2BDrh8s-4rsvc6zXaNAXZCMWJ-H4_KhT-HTTdg&s','Este día especial','Que este nuevo año de vida te traiga tantas alegrías como las que regalas a quienes te rodean, ANDREA hermosa. Que cada sueño se haga realidad y que tu hermosa sonrisa jamás se apague.']
];
const img=(u,alt)=>`<img src="${u}" alt="${alt}" onerror="this.style.display='none'">`;
let h='';
T.forEach((t,i)=>{const n=i+1;h+=`<div class="card pn hid" id="p${n}"><div class="av">${img(t[0],'Snoopy '+n)}</div><small>${n} / 5</small><h2>${t[1]}</h2><div class="box"><p>${t[2]}</p></div><div class="bar"><i></i></div><button class="btn hid" onclick="go(${n+1})">${n==4?'CELEBREMOS JUNTOS 🎁':'Siguiente →'}</button></div>`});
h+=`<div class="card pn hid" id="p5"><div class="av" style="width:104px;height:104px">${img(G+'ANd9GcTY4R-Cn9hEBprQvWIG9oXJutC13Bf98fEicuN0SAvrog&s=10','Snoopy 5')}</div><small>5 / 5</small><h2 id="ft" style="font-size:2.4rem">FELIZ CUMPLEAÑOS ANDREA HERMOSA</h2><div class="emo" id="fe"><span>🥳</span><span>🎉</span><span>🎂</span><span>🎁</span><span>🎈</span><span>🎊</span></div><div class="box" id="fp"><p>Hola ANDREA hermosa espero que pases un feliz cumpleaños, dile a tu mamá si me guarda un poco de pastel 🎂 para mi jajaja</p></div><button class="btn" onclick="gifts()">ELEGIR MI REGALO 🎁</button><button class="btn alt" onclick="location.reload()">↻ VOLVER A VER</button></div>`;
h+=`<div class="card pn hid" id="pg"><small>SORPRESA DE CUMPLEAÑOS</small><h2>ELIJE TU REGALO DE CUMPLEAÑOS</h2><div class="box" id="gs" style="font-size:1.1rem;padding:8px"></div><div class="gr" id="gr" style="pointer-events:none">${[1,2,3].map(n=>`<div class="gb" onclick="pick(${n})">${img(G+'ANd9GcRM7UZXmRaQCdyZ2TpPXWxmiGIGgSfaptpWNPFBZCwZ1w&s','Regalo '+n)}</div>`).join('')}</div></div>`;
h+=`<div class="card pn hid" id="pr"><small>¡REGALO SELECCIONADO!</small><h2>FELICITACIONES POR TU REGALO</h2><div class="rw"><img id="ri" alt="Regalo"></div><div class="box" id="rd"></div><button class="btn" onclick="retry()">↺ Volver a intentar</button><button class="btn alt" onclick="send()">💗 Este me gusta</button></div>`;
h+=`<div class="card pn hid" id="pe"><small id="eb">ENVIANDO ELECCIÓN</small><h2 id="et">Tu opción está siendo enviada</h2><div id="el" style="width:100%;margin:20px 0"><div class="bar"><i style="background:linear-gradient(90deg,#22d3ee,#ec4899,#f43f5e)"></i></div><div style="font-size:.7rem;letter-spacing:.2em;color:#fbcfe8;text-transform:uppercase">Procesando tu deseo...</div></div><div id="er" class="hid" style="width:100%"><div class="av" style="width:150px;height:150px;margin:0 auto 14px">${img('https://i.etsystatic.com/66825061/r/il/0ee1c5/8294289837/il_794xN.8294289837_2fh6.jpg','Snoopy')}</div><div class="box" style="font-size:1.5rem">✨ Tu opción de regalo ha sido enviada ✨</div><button class="btn" onclick="location.reload()">↻ Volver a ver</button></div></div>`;
$('ps').innerHTML=h;

function show(id,after){
  const cur=document.querySelector('.pn:not(.hid)'),nx=$(id);
  const run=()=>{if(cur){cur.classList.add('hid');cur.classList.remove('zo','zi')}nx.classList.remove('hid');nx.classList.add('zi');after&&after()};
  if(cur){cur.classList.add('zo');setTimeout(run,300)}else run();
}
function load(n){const p=$('p'+n),b=p.querySelector('.bar'),bt=p.querySelector('.btn');setTimeout(()=>{b.classList.add('hid');bt.classList.remove('hid');bt.classList.add('pop')},3000)}
function go(n){unmute();show('p'+n,()=>{if(n<5)load(n);else{rain();['ft','fe','fp'].forEach(i=>$(i).classList.add('pop'))}})}

/* ===== Cuenta regresiva ===== */
const Q=['5','4','3','2','1','FELIZ','CUMPLEAÑOS','ANDREA','HERMOSA'];
function start(){
  unmute();$('ban').classList.remove('hid');$('home').classList.add('hid');
  const sq=$('sq');sq.classList.remove('hid');let i=0;
  (function nx(){
    if(i>=Q.length){setTimeout(()=>{sq.classList.add('hid');$('ps').classList.remove('hid');show('p1',()=>load(1))},1200);return}
    const t=Q[i],num=i<5;
    sq.style.fontSize=num?'min(60vw,18rem)':t.length>8?'min(20vw,9rem)':'min(26vw,11rem)';
    sq.innerHTML=`<span style="animation-duration:${num?1:1.8}s">${t}</span>`;
    if(num)burst();i++;setTimeout(nx,num?1000:1800);
  })();
}

/* ===== Regalos ===== */
const R={
 1:{name:'Helado',img:G+'ANd9GcTOvruM41_GvnGrdtxAHihulXqs-Wee_EL-tpNOvF-U4Qxz74f4eEjuNjw&s',desc:'🎉 ¡Felicitaciones! Te ganaste una salida a comer helado conmigo 🍦😋✨'},
 2:{name:'Comida',img:G+'ANd9GcT7CecDmVyXoSG354Gy-2Tmajt-zqvlU4sMxYZZIkX-RQ&s',desc:'🎉 Felicitaciones, tu regalo será de ir a comer un día de estos conmigo a donde quieras y comer lo que quieras 🍔🍕🌮✨'},
 3:{name:'Flores',img:G+'ANd9GcQKkPjJLjm0n_TyeCuNplGiZcVSdXmVRndwCvkYP9ChFA&s',desc:'💐 FELICITACIONES TE GANASTE UNAS FLORES ESPERO CONSEGUIRLAS JAJAJA 🌸✨'}
};
let sel=R[1];
function gifts(){show('pg',shuffle)}
function shuffle(){
  const gr=$('gr');gr.style.pointerEvents='none';$('gs').textContent='✨ ¡Atenta! Los regalos se están mezclando...';
  const V=[['110%','150%','-100%'],['0%','-120%','130%'],['-110%','100%','-130%']];
  [...gr.children].forEach((b,i)=>{b.style.setProperty('--c',V[i][0]);b.style.setProperty('--a',V[i][1]);b.style.setProperty('--b',V[i][2]);b.classList.remove('sh');void b.offsetWidth;b.classList.add('sh')});
  setTimeout(()=>{[...gr.children].forEach(b=>b.classList.remove('sh'));gr.style.pointerEvents='auto';$('gs').textContent='🎁 ¡Listo! Toca uno de los regalos:'},5000);
}
function pick(n){burst();sel=R[n];sel.id=n;$('ri').src=sel.img;$('rd').innerHTML='<p>'+sel.desc+'</p>';show('pr')}
function retry(){show('pg');$('gr').style.pointerEvents='auto';$('gs').textContent='🎁 Toca el regalo que prefieras:'}
function send(){
  burst();
  fetch('https://formspree.io/f/xlgodlzp',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({'Regalo Seleccionado':sel.name,'Numero de Regalo':'Opcion #'+sel.id,'Mensaje':`¡ANDREA eligió la Opción #${sel.id}: ${sel.name}! 🎁✨`,'Fecha':new Date().toLocaleString()})}).catch(e=>console.log(e));
  show('pe',()=>setTimeout(()=>{$('el').classList.add('hid');$('eb').textContent='¡ELECCIÓN CONFIRMADA!';$('et').textContent='';$('er').classList.remove('hid');rain()},3000));
}
</script>
</body>
</html>
